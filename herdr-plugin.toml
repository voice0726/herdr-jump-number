id = "voice0726.jump-number"
name = "Jump Number"
version = "0.1.0"
description = "Show jump-key numbers on workspaces and tabs without breaking herdr's automatic labels."
min_herdr_version = "0.8.2"
platforms = ["linux", "macos"]

# ビルド工程は持たない([[build]] を書かない)。bun がソースを直接実行する。

[[startup]]
command = ["/bin/sh", "bin/launch.sh"]

# workspace.metadata_updated は意図的に購読しない。
# 自分の report-metadata がこのイベントを発火するため、購読すると無限ループになる。
[[events]]
on = "workspace.created"
command = ["/bin/sh", "bin/launch.sh"]
[[events]]
on = "workspace.moved"
command = ["/bin/sh", "bin/launch.sh"]
[[events]]
on = "workspace.reordered"
command = ["/bin/sh", "bin/launch.sh"]
[[events]]
on = "workspace.closed"
command = ["/bin/sh", "bin/launch.sh"]
[[events]]
on = "tab.created"
command = ["/bin/sh", "bin/launch.sh"]
[[events]]
on = "tab.moved"
command = ["/bin/sh", "bin/launch.sh"]
[[events]]
on = "tab.closed"
command = ["/bin/sh", "bin/launch.sh"]
[[events]]
on = "tab.renamed"
command = ["/bin/sh", "bin/launch.sh"]

# worktree remove は workspace.closed を発火しない。worktree.removed だけが出る。
[[events]]
on = "worktree.removed"
command = ["/bin/sh", "bin/launch.sh"]
# pane が抜けて workspace / tab が消えるとき、herdr 0.8.2 は
# workspace.closed / tab.closed を発火しないことがある:
#   - shell の exit で最後の pane が終了 -> pane.exited だけ
#   - tab 最後の pane を close -> pane.closed だけ
[[events]]
on = "pane.exited"
command = ["/bin/sh", "bin/launch.sh"]
[[events]]
on = "pane.closed"
command = ["/bin/sh", "bin/launch.sh"]

[[actions]]
id = "sync"
title = "Sync jump numbers"
contexts = ["global"]
command = ["/bin/sh", "bin/launch.sh"]
